# Clause inventory for ISO 19005-2:2011 (PDF/A-2), clause 6 "Technical requirements".
#
# WHY THIS EXISTS. Conformance coverage has been measured against veraPDF's test ids, which makes
# the profile the population: a requirement neither veraPDF nor this library checks cannot show up,
# because both sides agree by omission. This file makes the standard's own clause list the
# population instead, so "nothing checks this" becomes a visible value rather than an invisible one.
#
# WHAT IT IS. Clause numbers and headings only. No normative text is reproduced here; the standard
# is not held as a file and must not be transcribed into this repository. Each entry says what the
# clause is called and how it is scoped, not what it requires.
#
# HOW IT WAS BUILT. Read clause by clause from NEN-ISO 19005-2:2011 en through a licensed
# single-user viewer on 2026-09-07 (see docs/iso/ACQUISITION.md). Verified by a person, and not
# reproducible by CI or from a clone. Refs #418.
#
# scope: file      - constrains the conforming file; a validator can check it
#        reader    - constrains a conforming reader; a file validator has nothing to check
#        container - a heading whose children carry the requirements
# level: which conformance levels the clause applies to. Clause 5 defines the levels purely by
#        exclusion: Level B omits 6.2.11.7 and 6.7, Level U omits 6.7, Level A omits nothing.
#        Absent means all three.

standard: ISO 19005-2:2011
part: 2
read_on: 2026-09-07
source: NEN Connect licensed viewer, record 161167

