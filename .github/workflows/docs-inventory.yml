# Guards docs/pdf20-conformance.md against drifting from its sources.
#
# The table is generated by eng/generate-pdf20-inventory.py from three PDF Association
# datasets. A hand-edit to the .md, or a change to the generator that nobody re-ran,
# would leave the published inventory disagreeing with what the script produces — and
# the whole point of that page is that its claims can be checked.
#
# This runs as its own workflow rather than a step in the CI build for one reason: the
# generator downloads its inputs, and the Arlington archive alone is ~38 MB. Paying that
# on every push would tax runs that cannot possibly have caused drift, so the filter
# lists exactly the paths that can — which is every local input the generator reads,
# plus this file.
#
# One of those is a source directory, and that is deliberate. rule_class_provenance()
# reads src/VellumPdf.Conformance/Rules/ and derives six of the figures on the page,
# including how many rule classes claim clean-room derivation and how many of those also
# name veraPDF. Without that path a pull request editing only rule comments moves the
# published figures with the gate never running, which is precisely what the #418 and
# #428 re-derivation batches do. It costs ordinary source edits a run, and that is the
# right trade for a page whose whole argument is that its claims are checkable.
#
# Not covered: drift caused by the upstream datasets changing under a table nobody
# touched. Gating unrelated pull requests on someone else's repository changing would be
# wrong, so that case is deliberately left to a human re-running the generator.
#
# Worth knowing, since the rule path makes it reachable: --check regenerates the whole
# page, so upstream drift can now fail a pull request that only edited a rule comment and
# caused no drift of its own. That is a false red on the contributor's change rather than
# a missed one, which is the safer direction, but it is a real cost of the wider filter.

name: Docs inventory

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/pdf20-conformance.md'
      - 'eng/generate-pdf20-inventory.py'
      - 'src/VellumPdf.Conformance/Rules/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/pdf20-conformance.md'
      - 'eng/generate-pdf20-inventory.py'
      - 'src/VellumPdf.Conformance/Rules/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Inventory is up to date
        run: python eng/generate-pdf20-inventory.py --check
