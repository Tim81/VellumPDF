name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # mint the OIDC token for NuGet Trusted Publishing

jobs:
  # ── NuGet packages (libraries + the vellum-preflight dotnet tool) + the Release ──
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' yields an empty version; expected a 'vX.Y.Z' tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore VellumPdf.slnx

      - name: Build
        run: dotnet build VellumPdf.slnx -c Release --no-restore -p:Version="${{ steps.version.outputs.version }}"

      - name: Pack
        run: dotnet pack VellumPdf.slnx -c Release --no-build -o ${{ runner.temp }}/packages -p:Version="${{ steps.version.outputs.version }}"

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "${{ runner.temp }}/packages/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s failglob
          version="${{ steps.version.outputs.version }}"
          prerelease_flag=""
          if [[ "$version" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          # Release notes come from this version's CHANGELOG section: everything between its
          # own "## [x.y.z]" heading and the next "## [" heading. The generated-commit-title
          # list this replaced said nothing about breaking changes, which is most of what a
          # reader arriving from NuGet needs.
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            BEGIN { hdr = "## [" ver "]" }
            substr($0, 1, length(hdr)) == hdr { inside = 1; next }
            inside && substr($0, 1, 4) == "## [" { exit }
            inside { print }
          ' CHANGELOG.md \
            | sed -e '/./,$!d' \
            | tac | sed -e '/./,$!d' | tac \
            > "$notes_file"

          # Falling back rather than failing: packages are already pushed to NuGet by the step
          # above, and that cannot be undone. A release with weaker notes beats a published
          # version with no GitHub release at all, so an authoring slip degrades and warns.
          if [[ -s "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              "${{ runner.temp }}"/packages/*.nupkg \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              $prerelease_flag
          else
            echo "::warning::No '## [$version]' section found in CHANGELOG.md; using generated notes."
            gh release create "$GITHUB_REF_NAME" \
              "${{ runner.temp }}"/packages/*.nupkg \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease_flag
          fi

  # ── Native-AOT vellum-preflight binaries, one per RID (built on the target OS) ──
  # Native AOT cannot cross-compile across OS families, so this is a per-OS matrix.
  # linux-x64, win-x64 and osx-arm64 build natively on their runners and gate the job;
  # win-arm64 is a cross-arch build on the x64 Windows runner (needs the ARM64 MSVC
  # toolset) and is best-effort (continue-on-error) so it can never block the release.
  native-cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest,  experimental: false }
          - { rid: win-x64,   os: windows-latest, experimental: false }
          - { rid: osx-arm64, os: macos-latest,   experimental: false }
          - { rid: win-arm64, os: windows-latest, experimental: true  }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux AOT prerequisites (x64)
        if: matrix.os == 'ubuntu-latest' && matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Install Windows ARM64 build tools (win-arm64)
        if: matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          # Native-AOT cross-compilation to win-arm64 from the x64 runner needs the VC++
          # ARM64 toolset, which is not installed on the runner image by default.
          $installerDir = "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          $vsPath = & "$installerDir\vswhere.exe" -latest -property installationPath
          & "$installerDir\vs_installer.exe" modify --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart | Out-Null
          Write-Host "ARM64 VC toolset install requested for $vsPath"

      - name: Publish native AOT binary
        shell: bash
        run: >
          dotnet publish src/VellumPdf.Cli -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version="${{ steps.version.outputs.version }}"
          -o publish-out

      - name: Stage binary + checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          rid="${{ matrix.rid }}"
          ext=""
          [[ "$rid" == win-* ]] && ext=".exe"
          out="vellum-preflight-${version}-${rid}${ext}"
          cp "publish-out/vellum-preflight${ext}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "${out}.sha256"
          else
            shasum -a 256 "$out" > "${out}.sha256"
          fi
          echo "asset=$out" >> "$GITHUB_OUTPUT"

      - name: Attach to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.stage.outputs.asset }}" \
            "${{ steps.stage.outputs.asset }}.sha256" \
            --clobber
