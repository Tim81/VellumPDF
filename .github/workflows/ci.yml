name: CI

on:
  push:
    branches: [ main, v1.7-conformance ]
  pull_request:
    branches: [ main, v1.7-conformance ]

jobs:
  build:
    # Pinned to the specific label, not the floating `ubuntu-latest`: every apt pin below is
    # noble-only, and GitHub moves `ubuntu-latest` to a new release on its own schedule, which
    # would break all of them at once with no commit to blame (#230).
    runs-on: ubuntu-24.04
    # A hung test (a real one, or a DoesNotHang-named guard whose own assertion turned out not to
    # bound it) would otherwise run to GitHub's 360-minute default and burn the runner quietly
    # instead of failing loudly. A full run currently takes under 16 minutes; 30 leaves headroom
    # for oracle/network variance without masking a genuine hang for hours.
    timeout-minutes: 30
    env:
      # Every pinned oracle version in one place, referenced by both the install steps and the
      # version-assert step below, so bumping one means editing one line rather than two.
      VERAPDF_TAG: v1.30.2
      QPDF_VERSION: '12.4.1'
      QPDF_SHA256: 'db9122e88ec00c76ac6a14e09ffb92406db1773d47b968911ff6e69f28c09bf9'
      POPPLER_VERSION: '24.02.0-1ubuntu9.9'
      FONTS_DEJAVU_VERSION: '2.37-8'
      FONTS_TEXGYRE_VERSION: '20180621-6'
      # noble's apt pockets keep only the newest revision of each package, so a bare `=version`
      # pin eventually 404s the moment Ubuntu ships another revision (poppler-utils alone has
      # already rolled 9.1 through 9.8 off the archive). Point apt at the Ubuntu snapshot service
      # for the date the versions above were measured, so the exact revision keeps resolving
      # after the live archive rotates past it — see the "Install poppler and fonts" step.
      APT_SNAPSHOT: '20260830T000000Z'
      ZXING_VERSION: '3.1.1'
      PILLOW_VERSION: '12.3.0'
    steps:
      # Full history: the clean-room check scans the branch's commit MESSAGES as well as its files,
      # and a merged message cannot be corrected afterwards. The default depth-1 checkout gives it
      # nothing to scan, and it skips silently rather than failing, so the gate would pass while the
      # violation merged.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet --version

      - name: Clean-room check
        shell: pwsh
        run: ./eng/clean-room-check.ps1

      - name: Restore
        run: dotnet restore VellumPdf.slnx

      - name: Check for vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          # Capture output; `set -e` fails the step if `dotnet list` itself errors, so a
          # silent restore failure cannot let a vulnerable package slip through the gate.
          report=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected — see the report above."
            exit 1
          fi

      - name: Build
        run: dotnet build VellumPdf.slnx -c Release --no-restore

      - name: Install poppler and fonts (pinned)
        # A font or poppler update changes fixture rendering and oracle output with no commit to
        # blame (#230), so pin exact versions rather than taking apt's default. The `=version`
        # pins alone are not enough: noble's -updates/-security pockets keep only the newest
        # revision, so the moment Ubuntu ships another one, these exact revisions 404 out of the
        # live archive and every PR goes red with no code change involved. `-o APT::Snapshot`
        # adds the dated Ubuntu snapshot alongside whatever apt sources the runner already has
        # configured (additive, not a replacement — ubuntu-24.04's own sources resolve through
        # `mirror+file:/etc/apt/apt-mirrors.txt`, not a literal archive.ubuntu.com host, so this
        # comment does not assume which host actually serves a given fetch). The assertion below
        # is what makes the outcome observable instead of assumed: `apt-get update` exits 0 even
        # when the snapshot fetch fails outright, so without it a silently-unpinned install would
        # pass unnoticed. Verified in a fresh ubuntu:24.04 container against an already-rotated-
        # off revision — poppler-utils 24.02.0-1ubuntu9.1, absent from today's live archive — a
        # snapshot dated to when 9.1 was current resolved and installed it correctly. If a real
        # bump is ever needed instead of just chasing a rotated revision — a new poppler feature,
        # a font correction — update POPPLER_VERSION / FONTS_*_VERSION together with a new
        # APT_SNAPSHOT: a UTC day at or after the new revision's publication (stamps are midnight
        # UTC, so a same-day publication needs the next day's stamp), confirmed with
        # `curl -sI https://snapshot.ubuntu.com/ubuntu/<stamp>/dists/noble/InRelease` — a future-
        # dated or mistyped stamp silently serves latest instead of erroring. Mention the change
        # in CONTRIBUTING.md too.
        run: |
          set -euo pipefail
          sudo apt-get update -o APT::Snapshot="${APT_SNAPSHOT}"
          # The step comment above explains why this can't be skipped: a failed snapshot fetch
          # does not fail this command on its own.
          apt_lists=$(ls /var/lib/apt/lists/)
          if ! grep -q "^snapshot\.ubuntu\.com_ubuntu_${APT_SNAPSHOT}_" <<< "$apt_lists"; then
            echo "::error::apt fell back to the live archive; snapshot ${APT_SNAPSHOT} was not used"
            exit 1
          fi
          sudo apt-get install -y -o APT::Snapshot="${APT_SNAPSHOT}" \
            "poppler-utils=${POPPLER_VERSION}" \
            "fonts-dejavu-core=${FONTS_DEJAVU_VERSION}" \
            "fonts-texgyre=${FONTS_TEXGYRE_VERSION}"

      - name: Install qpdf (pinned)
        # apt's qpdf on ubuntu-24.04 is 11.9.0, two majors behind upstream; `--check`'s output
        # has changed across qpdf majors and #186's acceptance criterion is exactly that output
        # (#230). Installed from the official release artifact instead, matched by checksum.
        run: |
          set -euo pipefail
          asset="qpdf-${QPDF_VERSION}-bin-linux-x86_64.zip"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/qpdf.zip \
            "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/${asset}"
          echo "${QPDF_SHA256}  /tmp/qpdf.zip" | sha256sum -c -
          sudo mkdir -p "/opt/qpdf-${QPDF_VERSION}"
          sudo unzip -o -q /tmp/qpdf.zip -d "/opt/qpdf-${QPDF_VERSION}"
          echo "/opt/qpdf-${QPDF_VERSION}/bin" >> "$GITHUB_PATH"
          echo "QPDF_HOME=/opt/qpdf-${QPDF_VERSION}" >> "$GITHUB_ENV"

      - name: Pull veraPDF Docker image
        run: docker pull verapdf/cli:${{ env.VERAPDF_TAG }}

      - name: Install veraPDF shim
        run: |
          # The oracle tests shell out to `verapdf`; back it with the official Docker
          # image. The image ENTRYPOINT is /opt/verapdf/verapdf, so arguments pass
          # straight through — the shim must NOT prepend the word "verapdf". Mounting
          # /tmp lets the tests' temp-dir PDF paths resolve identically in-container.
          sudo tee /usr/local/bin/verapdf > /dev/null << 'SHIM'
          #!/bin/sh
          exec docker run --rm -v /tmp:/tmp -w /tmp verapdf/cli:${{ env.VERAPDF_TAG }} "$@"
          SHIM
          sudo chmod +x /usr/local/bin/verapdf

      - uses: actions/setup-python@v7
        with:
          # Pinned for the same reason as the pip versions below: a deterministic interpreter
          # for the barcode oracle rather than whatever '3.x' resolves to on a given run.
          python-version: '3.14'

      - name: Install barcode decode oracle (zxing-cpp)
        # Pinned for CI reproducibility (#230), not because 3.1.1 fails the EAN add-on assertion
        # it was originally held against — that test only asserts the main digits and tolerates
        # the add-on's presentation varying by version (see CONTRIBUTING.md), and it landed in
        # the same commit as this pin, passing under 3.1.1. pillow is pinned alongside it so a
        # Pillow release can't shift fixture rendering the same way an unpinned apt font package
        # could.
        run: python -m pip install "zxing-cpp==${ZXING_VERSION}" "pillow==${PILLOW_VERSION}"

      - name: Assert pinned oracle versions
        # Prints and checks each pinned tool's own version report against the job-level env vars
        # above, so drift between this file and what actually got installed fails loudly instead
        # of silently changing what every downstream oracle test validates against (#230).
        # Comparisons are exact-line or exact-value, not substring greps: "12.4.1" is a substring
        # of "12.4.10", so a careless `grep -qF` would pass against a future revision it was
        # never meant to accept.
        run: |
          set -euo pipefail

          qpdf_out=$(qpdf --version)
          qpdf_line=${qpdf_out%%$'\n'*}
          echo "$qpdf_line"
          [ "$qpdf_line" = "qpdf version ${QPDF_VERSION}" ]

          # pdftotext -v reports only poppler's upstream version (e.g. "24.02.0"), never the
          # Ubuntu package revision after the dash — apt can ship a new revision of the same
          # upstream release, and fonts have no version-reporting flag at all. dpkg-query reads
          # the installed package record directly, which is the only way to see the full pin —
          # but it proves the package record, not the binary the tests actually invoke. CLAUDE.md
          # documents pdftotext resolving to two different programs on a developer machine
          # depending on which shell launched the test host, so keep the identity check too.
          poppler_out=$(pdftotext -v 2>&1)
          poppler_line=${poppler_out%%$'\n'*}
          echo "$poppler_line"
          [ "$poppler_line" = "pdftotext version ${POPPLER_VERSION%%-*}" ]

          echo "--- installed package versions ---"
          dpkg-query -W -f='${Package} ${Version}\n' poppler-utils fonts-dejavu-core fonts-texgyre
          assert_pkg_version() {
            local pkg="$1" expected="$2" actual
            actual=$(dpkg-query -W -f='${Version}' "$pkg")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$pkg is $actual, expected $expected"
              exit 1
            fi
          }
          assert_pkg_version poppler-utils "$POPPLER_VERSION"
          assert_pkg_version fonts-dejavu-core "$FONTS_DEJAVU_VERSION"
          assert_pkg_version fonts-texgyre "$FONTS_TEXGYRE_VERSION"

          verapdf_out=$(verapdf --version 2>&1)
          verapdf_line=${verapdf_out%%$'\n'*}
          echo "$verapdf_line"
          [ "$verapdf_line" = "veraPDF ${VERAPDF_TAG#v}" ]

          python -c "
          import importlib.metadata as m
          import os
          zxing_expected = os.environ['ZXING_VERSION']
          pillow_expected = os.environ['PILLOW_VERSION']
          zxing_actual = m.version('zxing-cpp')
          pillow_actual = m.version('pillow')
          print('zxing-cpp', zxing_actual)
          print('pillow', pillow_actual)
          assert zxing_actual == zxing_expected, zxing_actual
          assert pillow_actual == pillow_expected, pillow_actual
          "

      - name: Test
        # REQUIRE_VERAPDF makes the conformance oracle fail (not silently skip) if the verapdf
        # shim is unavailable, so a broken image can't let the cross-validation gate pass vacuously.
        # REQUIRE_BARCODE_ORACLE does the same for the zxing-cpp decode oracle. ORACLE_INVOCATION_LOG
        # makes ExternalTool.RunProcess append one line per successful, non-probe oracle launch to a
        # file suffixed with its own process id, so the step below can assert the oracles didn't
        # just resolve — they actually ran (#228).
        env:
          REQUIRE_VERAPDF: '1'
          REQUIRE_BARCODE_ORACLE: '1'
          # DiffEngine 20.0.0 reads its disable flag lazily instead of capturing it once at
          # type-init (VerifyTests/DiffEngine#825) and now installs a bundled viewer as an
          # always-available last-resort tool, so a detection miss that was a harmless no-op in
          # 19.x could launch a GUI here instead. Setting this explicitly closes that gap.
          DiffEngine_Disabled: 'true'
          ORACLE_INVOCATION_LOG: ${{ runner.temp }}/oracle-invocations
        # coverlet.MTP (#200) takes its scope from coverlet.testconfig.json (copied to
        # every test host's own output directory as testconfig.json by tests/Directory.Build.props)
        # rather than a VSTest `--settings` runsettings file. `--coverlet` on the command line is
        # only the activation switch; the include/exclude scope itself has to live in that config
        # file, not command-line coverlet-include/coverlet-exclude options, because coverlet.MTP's
        # command-line mode (active whenever no config file is present) merges in its own default
        # exclude-by-attribute list (GeneratedCodeAttribute, CompilerGeneratedAttribute), which
        # silently drops every compiler- and source-generator-emitted member from instrumentation.
        # That cost VellumPdf.Cli its entire System.Text.Json source-generated CliJsonContext
        # partial and every assembly some of their auto-property backing fields, a real regression
        # measured and then reverted while re-baselining this gate for the migration. A config file
        # is authoritative and does not get that default list injected, so scoping through
        # testconfig.json is what keeps generated code counted the way coverlet.collector counted
        # it under VSTest. Confirmed by measurement, not assumed: with the config file, every one
        # of the eight shipping assemblies' valid-line counts, and the combined total, matched the
        # pre-migration numbers this gate already carried at the time of that measurement (both
        # have since moved a little as unrelated PRs landed; parity is about the migration
        # dropping nothing, not about the two figures staying pinned together forever). See
        # CONTRIBUTING.md for the equivalent local reproduction command.
        run: |
          # A stale per-process log from an earlier run on the same runner would otherwise be
          # counted alongside this run's own files, letting a genuinely disengaged oracle hide
          # behind leftovers — silent on a self-hosted or reused runner, though GitHub-hosted
          # runners are ephemeral and would not carry one over on their own (#228 review). The
          # coverage directory gets the same treatment for the same reason: a stale report left
          # over from an earlier run on a reused runner could otherwise be counted alongside this
          # run's own seven, hiding a report this run genuinely failed to produce.
          rm -f "${{ runner.temp }}/oracle-invocations".*
          rm -rf "${{ runner.temp }}/coverage"
          dotnet test VellumPdf.slnx -c Release --no-build --results-directory ${{ runner.temp }}/coverage -- --coverlet

      - name: Assert oracle invocation floors
        # #227 made a missing oracle tool fail loudly instead of passing vacuously; it says nothing
        # about a tool that is present, resolves correctly, and never actually gets called — a
        # disabled filter, a gate condition that stopped matching, or a refactor that quietly drops
        # the call all leave the same pass/skip counts an engaged oracle would (#228). Counting has
        # to happen here, workflow-side, rather than as an in-process assertion: each test project
        # above runs as its own process, and nothing guarantees which one finishes last. Each
        # process appended its own '<tool><TAB><first argument>' lines to a file suffixed with its
        # process id (see ORACLE_INVOCATION_LOG on the Test step) for every successful, non-probe
        # launch — an identity probe (ExternalTool.CheckIdentity) and a launch that never started
        # are both excluded, so neither can pad a tool's count without the tool having actually
        # validated anything; this step concatenates those files and sums a count per tool.
        # python3 is folded into python's count: ZxingDecodeOracleTests falls back from "python" to
        # "python3" and logs whichever name actually launched, so the two are one oracle under two
        # possible names, not two oracles.
        #
        # Floors are 90% of a full local run with every oracle enabled (REQUIRE_ORACLES=1, QPDF_HOME
        # / POPPLER_HOME / VERAPDF_HOME all pointed at real installs), rounded down, measured
        # against this same commit: verapdf 298, pdftoppm 135, python 135, qpdf 29, pdftotext 8,
        # pdfsig 2. 90% tolerates ordinary run-to-run variance (a data-driven theory whose case
        # count shifts, a retried flake) without hiding a regression the way pinning the exact
        # measured count would risk doing on its own false positives. These floors are
        # shell-independent: CI always sets POPPLER_HOME, so it always gets poppler's
        # pdftotext/pdftoppm — the PowerShell/Git Bash divergence CONTRIBUTING.md documents (a bare
        # "pdftotext" resolving to poppler vs. Xpdf depending on which shell launched the test host)
        # only shows up when POPPLER_HOME is unset, which CI never does. Re-measure and update these
        # floors, and the numbers in this comment, whenever a fixture set changes size on purpose.
        shell: bash
        run: |
          set -euo pipefail

          log_prefix="${{ runner.temp }}/oracle-invocations"
          shopt -s nullglob
          files=("$log_prefix".*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No oracle invocation log files found matching $log_prefix.*"
            exit 1
          fi
          echo "Invocation log files: ${files[*]}"

          declare -A floors=(
            [verapdf]=268
            [pdftoppm]=121
            [python]=121
            [qpdf]=26
            [pdftotext]=7
            [pdfsig]=1
          )

          failed=0
          printf '%-10s %8s %8s\n' tool count floor
          for tool in verapdf pdftoppm python qpdf pdftotext pdfsig; do
            # python3 counts toward python's total: see the step comment above.
            count=$(awk -F'\t' -v t="$tool" '$1 == t || (t == "python" && $1 == "python3") { c++ } END { print c + 0 }' "${files[@]}")
            floor=${floors[$tool]}
            printf '%-10s %8d %8d\n' "$tool" "$count" "$floor"
            if [ "$count" -lt "$floor" ]; then
              echo "::error::$tool was invoked $count times, below the floor of $floor — an oracle that should have run may not have"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, glob, os, sys

          cov_dir = os.path.join(os.environ["RUNNER_TEMP"], "coverage")
          # coverlet.MTP (#200) names its own report coverage.cobertura.<timestamp>.xml, with the
          # timestamp coverlet stamps at the moment it writes the file rather than VSTest's fixed
          # coverage.cobertura.xml under a per-run guid folder, so the glob matches the timestamp
          # segment instead of a guid directory.
          files = glob.glob(os.path.join(cov_dir, "**", "coverage.cobertura.*.xml"), recursive=True)
          if not files:
              print("::error::No coverage.cobertura.*.xml files found under", cov_dir)
              sys.exit(1)

          THRESHOLD = 84
          PER_ASSEMBLY_FLOOR = 40
          MIN_TOTAL_LINES = 29000

          # coverlet.testconfig.json scopes instrumentation to these eight (#200; #229 under
          # the old coverlet.collector runsettings). Cobertura's <package name> is the compiled
          # assembly name, not the project name — VellumPdf.Cli builds as vellum-preflight. When a
          # ninth package ships under src/, add its assembly name here.
          EXPECTED_ASSEMBLIES = frozenset({
              "VellumPdf.Barcodes",
              "VellumPdf.Conformance",
              "VellumPdf.Fonts.Standard14",
              "VellumPdf.Kernel",
              "VellumPdf.Layout",
              "VellumPdf.Reader",
              "VellumPdf.Signing",
              "vellum-preflight",
          })

          # One report per test project — Barcodes, Cli, Conformance, Kernel, Layout, Reader and
          # TestSupport.Tests. Checked further down, after the assembly-name check: three of the seven
          # (Kernel.Tests, Layout.Tests, Reader.Tests) happen to instrument an identical assembly set
          # (Kernel, Layout, Reader, Signing), so losing one of them costs no assembly its name and the
          # name check alone would miss it silently. Update alongside EXPECTED_ASSEMBLIES when a test
          # project is added or removed.
          EXPECTED_REPORT_COUNT = 7

          # Each test project emits one cobertura report instrumenting the same shared
          # assemblies, so a source line appears in several reports. Merge per (file, line):
          # count each line once, covered if any report covered it. Summing the per-report
          # totals would multiply the shared surface by the number of test projects.
          merged = {}
          empty_report_count = 0
          for f in sorted(files):
              root = ET.parse(f).getroot()
              file_lines = {}
              # Key by (assembly, file, line) so same-named files in different assemblies
              # (e.g. AssemblyInfo.cs) do not collide.
              for pkg in root.iter("package"):
                  pkgname = pkg.get("name", "")
                  for cls in pkg.iter("class"):
                      fn = cls.get("filename", "").replace("\\", "/")
                      # A deterministic build can embed a source path either rooted at its own project
                      # folder or still carrying a leading src/tests/eng segment, depending on how that
                      # project computed its relative source root. Strip a leading one unconditionally so
                      # the same physical file normalizes to the same key regardless of which shape a
                      # given report used — two spellings of one file were observed doubling four
                      # assemblies' denominators in a local run before this line was added.
                      for _lead in ("src/", "tests/", "eng/"):
                          if fn.startswith(_lead):
                              fn = fn[len(_lead):]
                              break
                      # Coverlet reports the same source file with different prefixes across
                      # test-project reports (an absolute runner path in one, an assembly-relative
                      # path in another). Keying on the raw filename counts each line once per
                      # prefix, inflating the denominator. Normalize to the path relative to the
                      # assembly root (the package name) so a line is counted once per (assembly,
                      # relative path); fall back to a src/tests/eng anchor when the package name
                      # is not the folder name (e.g. an assembly renamed from its directory).
                      _root = pkgname + "/"
                      _i = fn.find(_root)
                      if _i != -1:
                          fn = fn[_i + len(_root):]
                      else:
                          for _m in ("/src/", "/tests/", "/eng/"):
                              _j = fn.find(_m)
                              if _j != -1:
                                  fn = fn[_j + len(_m):]
                                  break
                      for ln in cls.iter("line"):
                          key = (pkgname, fn, ln.get("number"))
                          file_lines[key] = file_lines.get(key, False) or int(ln.get("hits", 0)) > 0
              fc = sum(1 for v in file_lines.values() if v)
              fv = len(file_lines)
              print(f"  {os.path.relpath(f, cov_dir)}: covered={fc}, valid={fv}, line-rate={fc/fv if fv else 0:.4f}")
              if fv == 0:
                  empty_report_count += 1
              for key, v in file_lines.items():
                  merged[key] = merged.get(key, False) or v

          # A crashed or partial run still writes a coverage.cobertura.xml (#229): the file-count
          # check further down can't tell that apart from a healthy one, and a report's exclusive lines
          # leaving the denominator along with the numerator can make the percentage RISE while
          # actual coverage falls. Checking which assembly NAMES survived the merge catches both
          # a report that never got written and one that got written empty — either way the
          # assembly has no keys in `merged` — and fails by name instead of by an arithmetic side
          # effect. This runs before the count/empty checks below so a report with an assembly
          # exclusive to it still fails by naming that assembly, which is the more actionable message
          # when it applies.
          found_assemblies = frozenset(asm for asm, _, _ in merged)
          missing = EXPECTED_ASSEMBLIES - found_assemblies
          if missing:
              print(f"::error::No coverage data for: {', '.join(sorted(missing))}. "
                    "A report is missing, or the matching test project's report was written empty.")
              sys.exit(1)
          unexpected = found_assemblies - EXPECTED_ASSEMBLIES
          if unexpected:
              # An empty <package name=""> would otherwise join this list as a literal empty string,
              # printing a bare "." with nothing readable in front of it.
              display = sorted(asm if asm else "(unnamed package)" for asm in unexpected)
              print(f"::error::Unexpected assemblies in coverage data: {', '.join(display)}. "
                    "Add them to EXPECTED_ASSEMBLIES if this is a new shipping package, or fix "
                    "coverlet.testconfig.json if a test assembly is leaking through the "
                    "exclude filter.")
              sys.exit(1)

          # The name check above can't see a report whose whole assembly set is shared with other
          # surviving reports (Kernel.Tests, Layout.Tests, Reader.Tests all instrument
          # Kernel+Layout+Reader+Signing identically) — losing one of those costs no assembly its name.
          # Catch that by counting reports instead.
          if len(files) != EXPECTED_REPORT_COUNT:
              print(f"::error::Found {len(files)} coverage.cobertura.*.xml files under {cov_dir}, "
                    f"expected {EXPECTED_REPORT_COUNT}.")
              sys.exit(1)

          # VellumPdf.TestSupport.Tests only exercises VellumPdf.TestSupport, which the exclude filter
          # above removes from instrumentation, so its own report is expected to carry zero packages and
          # zero valid lines — the one report this tolerates. coverlet.MTP writes every project's report
          # flat into the shared --results-directory, named only by its own write timestamp, with
          # nothing in the file name or content saying which test project produced it, so this counts
          # empty reports rather than matching one by name: a second empty report means something
          # besides VellumPdf.TestSupport.Tests was written empty by a crashed or partial run — the same
          # identical-assembly-set gap the count check above closes, but for a report emptied in place
          # rather than deleted.
          ALLOWED_EMPTY_REPORTS = 1
          if empty_report_count > ALLOWED_EMPTY_REPORTS:
              print(f"::error::{empty_report_count} coverage reports were empty (covered=0, valid=0); "
                    f"expected at most {ALLOWED_EMPTY_REPORTS} (VellumPdf.TestSupport.Tests's own report).")
              sys.exit(1)

          # A per-assembly floor so a new subsystem landing at ~0% coverage can't hide behind the
          # other seven assemblies' average (#229) — a whole new module moves the combined figure
          # by well under a point. This is a floor, not a target: set comfortably below every
          # assembly's measured rate so it only fires on a real regression.
          #
          # The floor alone doesn't stop the #229 defect one level down: an assembly whose instrumentation
          # collapses to a single covered line reports 100% and clears it, while its real multi-thousand-
          # line denominator vanishes from the merge — the same shape as a missing report, just contained
          # to one assembly instead of all of them. MIN_VALID_LINES pins each assembly's valid-line count
          # to roughly 75% of what it measured when this gate was re-baselined (#229), so a collapsed
          # denominator fails even though its (tiny) numerator still divides out to 100%. Re-measured
          # for the coverlet.MTP migration (#200) once instrumentation was scoped through
          # coverlet.testconfig.json rather than command-line filters (see the Test step): every
          # assembly's valid-line count matched its pre-migration measurement at the time (three
          # have since grown a little as unrelated PRs added code; the numbers below track the
          # current measurement), so these floors carry over unchanged rather than re-baselined
          # lower.
          MIN_VALID_LINES = {
              "VellumPdf.Barcodes": 3800,        # measured 5064
              "VellumPdf.Conformance": 7750,     # measured 10348
              "VellumPdf.Fonts.Standard14": 20,  # measured 29 — a 29-line assembly needs more slack
              "VellumPdf.Kernel": 5800,          # measured 7773
              "VellumPdf.Layout": 1000,          # measured 1393
              "VellumPdf.Reader": 1900,          # measured 2608
              "VellumPdf.Signing": 800,          # measured 1109
              "vellum-preflight": 2300,          # measured 3077
          }

          per_asm = {}
          for (asm, fn, ln), v in merged.items():
              c, t = per_asm.get(asm, (0, 0))
              per_asm[asm] = (c + (1 if v else 0), t + 1)

          print("Per-assembly line coverage:")
          below_floor = []
          collapsed = []
          for asm in sorted(per_asm):
              c, t = per_asm[asm]
              rate = c / t * 100 if t else 0
              print(f"  {asm}: covered={c}, valid={t}, line-rate={rate:.2f}%")
              if rate < PER_ASSEMBLY_FLOOR:
                  below_floor.append((asm, c, t, rate))
              min_valid = MIN_VALID_LINES.get(asm, 0)
              if t < min_valid:
                  collapsed.append((asm, t, min_valid))
          if below_floor:
              for asm, c, t, rate in below_floor:
                  print(f"::error::{asm} line coverage {rate:.2f}% (covered={c}, valid={t}) "
                        f"is below the {PER_ASSEMBLY_FLOOR}% per-assembly floor.")
              sys.exit(1)
          if collapsed:
              for asm, t, min_valid in collapsed:
                  print(f"::error::{asm} instrumented only {t} valid lines, below the {min_valid}-line "
                        "minimum — its coverage denominator likely collapsed (fewer sequence points "
                        "recorded, not necessarily lower coverage).")
              sys.exit(1)

          total_valid = len(merged)
          total_covered = sum(1 for v in merged.values() if v)
          combined = total_covered / total_valid if total_valid else 0
          pct = combined * 100
          print(f"Combined (merged) line coverage: {pct:.1f}% over {total_valid} unique lines (threshold: {THRESHOLD}%)")
          if total_valid < MIN_TOTAL_LINES:
              print(f"::error::Merged coverage covers only {total_valid} lines, below the "
                    f"{MIN_TOTAL_LINES}-line minimum expected across all reports (measured 31,401).")
              sys.exit(1)
          if pct < THRESHOLD:
              print(f"::error::Line coverage {pct:.1f}% is below the required threshold of {THRESHOLD}%.")
              sys.exit(1)
          print("Coverage gate passed.")
          EOF

      - name: Format check
        run: dotnet format VellumPdf.slnx --verify-no-changes

      - name: Pack
        run: dotnet pack VellumPdf.slnx -c Release --no-build -o ${{ runner.temp }}/packages

  aot-smoke:
    # Deliberately left on the floating ubuntu-latest label: this job carries no apt version
    # pins, so it has nothing for a label move to break the way the build job's oracle installs
    # would (#230).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet --version

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: AOT smoke test
        shell: pwsh
        run: ./eng/aot/run-aot-smoke.ps1
