version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor/patch bumps land together; a major stays its own PR so a snapshot-risk bump like
      # #221 is attributable to one dependency, not buried in a batch. The one shipped runtime
      # dependency is excluded even from this group: its patches change emitted CMS/PAdES bytes,
      # so it does not belong next to routine test-tooling churn.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "System.Security.Cryptography.Pkcs"
    ignore:
      # Directory.Packages.props pins Pkcs per target framework: 10.0.x for net10.0 and 11.0.x for
      # net11.0. Without this rule Dependabot can propose 11.x for the net10.0 entry, which would
      # put System.Formats.Asn1 11 into a net10.0 consumer. How it treats two conditional entries
      # for one package has not yet been observed, so read the first Pkcs PR against this file to
      # confirm it changes only one line before merging. A move of the net11.0 line to 12.x is a
      # manual edit, made when net12.0 is added. ci.yml's "Check Pkcs per target framework" step
      # fails the build if the net10.0 package group ever names a Pkcs version outside 10.x.
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # No group: every action here is currently pinned to a floating major tag (e.g.
    # actions/checkout@v7), so only major bumps ever surface. A group block would read as doing
    # something it cannot.

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # This updater parses global.json but does not act on rollForward, so it proposes SDKs
    # outside the pinned 11.0.1xx feature band (a later 11.0.2xx, eventually 12.x) as readily as
    # ones inside it. That is intended, not a bug in this config: #379 pins the band deliberately
    # and its CONTRIBUTING rule requires a human to merge a band move on purpose and CI-validate
    # it before the next tag, so each such PR is that signal, not noise to dismiss.
